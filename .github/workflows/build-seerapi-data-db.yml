name: Build IronsBot Data DB

on:
  workflow_run:
    workflows: ["Sync Upstream"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/build_seerapi_data_db.py"
      - "scripts/build_new_content_index.py"
      - ".github/workflows/build-seerapi-data-db.yml"
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        description: "Force rebuild even when api-data release is unchanged"
        required: false
        default: false

concurrency:
  group: seerapi-data-build
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.source_check.outputs.skip }}
      remote_sha: ${{ steps.source_check.outputs.remote_sha }}
      remote_partner_sha: ${{ steps.source_check.outputs.remote_partner_sha }}
      remote_item_catalog_sha: ${{ steps.source_check.outputs.remote_item_catalog_sha }}
      remote_special_effect_status_sha: ${{ steps.source_check.outputs.remote_special_effect_status_sha }}
      remote_config_package_version: ${{ steps.source_check.outputs.remote_config_package_version }}
      remote_config_package_manifest_sha: ${{ steps.source_check.outputs.remote_config_package_manifest_sha }}
      build_sha: ${{ steps.build_ref.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record build revision
        id: build_ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check data source changes
        id: source_check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
          PARTNER_CONTRACTS_URL: https://raw.githubusercontent.com/Murmansk-Seer/config-sources/main/unity/partner_contracts.json
          UNITY_ITEM_CATALOG_URL: https://raw.githubusercontent.com/Murmansk-Seer/config-sources/main/unity/itemsOptimizeCatItems17.json
          SPECIAL_EFFECT_STATUS_URL: https://raw.githubusercontent.com/Murmansk-Seer/config-sources/main/unity/signIconFight.json
          CONFIG_PACKAGE_BASE_URL: https://newseer.61.com/Assets/StandaloneWindows64/ConfigPackage/
        run: |
          set -e
          remote_sha="$(
            curl -fsSL https://github.com/Murmansk-Seer/api-data/releases/download/latest/seerapi-data.sqlite.sha256 \
              | awk '{print $1}'
          )"
          remote_partner_sha="$(
            curl -fsSL "${PARTNER_CONTRACTS_URL}" | sha256sum | awk '{print $1}'
          )"
          remote_item_catalog_sha="$(
            curl -fsSL "${UNITY_ITEM_CATALOG_URL}" | sha256sum | awk '{print $1}'
          )"
          remote_special_effect_status_sha="$(
            curl -fsSL "${SPECIAL_EFFECT_STATUS_URL}" | sha256sum | awk '{print $1}'
          )"
          config_package_version="$(
            curl -fsSL "${CONFIG_PACKAGE_BASE_URL}PackageManifest_ConfigPackage.version?t=$(date +%s)"
          )"
          remote_config_package_manifest_sha="$(
            curl -fsSL "${CONFIG_PACKAGE_BASE_URL}PackageManifest_ConfigPackage_${config_package_version}.bytes" \
              | sha256sum | awk '{print $1}'
          )"
          previous_sha=""
          previous_partner_sha=""
          previous_item_catalog_sha=""
          previous_special_effect_status_sha=""
          previous_config_package_version=""
          previous_config_package_manifest_sha=""
          if [ -f .build-state/api-data-sha256 ]; then
            previous_sha="$(cat .build-state/api-data-sha256)"
          fi
          if [ -f .build-state/partner-contracts-sha256 ]; then
            previous_partner_sha="$(cat .build-state/partner-contracts-sha256)"
          fi
          if [ -f .build-state/unity-item-catalog-sha256 ]; then
            previous_item_catalog_sha="$(cat .build-state/unity-item-catalog-sha256)"
          fi
          if [ -f .build-state/special-effect-status-sha256 ]; then
            previous_special_effect_status_sha="$(cat .build-state/special-effect-status-sha256)"
          fi
          if [ -f .build-state/config-package-manifest-sha256 ]; then
            previous_config_package_manifest_sha="$(cat .build-state/config-package-manifest-sha256)"
          fi
          if [ -f .build-state/config-package-version ]; then
            previous_config_package_version="$(cat .build-state/config-package-version)"
          fi

          echo "remote_sha=${remote_sha}" >> "$GITHUB_OUTPUT"
          echo "remote_partner_sha=${remote_partner_sha}" >> "$GITHUB_OUTPUT"
          echo "remote_item_catalog_sha=${remote_item_catalog_sha}" >> "$GITHUB_OUTPUT"
          echo "remote_special_effect_status_sha=${remote_special_effect_status_sha}" >> "$GITHUB_OUTPUT"
          echo "remote_config_package_version=${config_package_version}" >> "$GITHUB_OUTPUT"
          echo "remote_config_package_manifest_sha=${remote_config_package_manifest_sha}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE}" != "true" ] && [ "${GITHUB_EVENT_NAME}" != "push" ] && [ -n "${previous_sha}" ] && [ -n "${previous_partner_sha}" ] && [ -n "${previous_item_catalog_sha}" ] && [ -n "${previous_special_effect_status_sha}" ] && [ -n "${previous_config_package_version}" ] && [ -n "${previous_config_package_manifest_sha}" ] && [ "${remote_sha}" = "${previous_sha}" ] && [ "${remote_partner_sha}" = "${previous_partner_sha}" ] && [ "${remote_item_catalog_sha}" = "${previous_item_catalog_sha}" ] && [ "${remote_special_effect_status_sha}" = "${previous_special_effect_status_sha}" ] && [ "${config_package_version}" = "${previous_config_package_version}" ] && [ "${remote_config_package_manifest_sha}" = "${previous_config_package_manifest_sha}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "api-data release, official ConfigPackage manifest, partner contracts, Unity item catalog, and special effect statuses are unchanged; skipping IronsBot DB build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Build required: force=${FORCE}, event=${GITHUB_EVENT_NAME}, api-data=${remote_sha}/${previous_sha:-none}, config-package-version=${config_package_version}/${previous_config_package_version:-none}, config-package-manifest=${remote_config_package_manifest_sha}/${previous_config_package_manifest_sha:-none}, partner-contracts=${remote_partner_sha}/${previous_partner_sha:-none}, unity-item-catalog=${remote_item_catalog_sha}/${previous_item_catalog_sha:-none}, special-effect-status=${remote_special_effect_status_sha}/${previous_special_effect_status_sha:-none}"
          fi

  render-effect-icon-cache:
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # Normal runs seed the last release and only repair missing or invalid
    # icons. A cold first release may need to render the full icon set.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install parser dependency
        run: python -m pip install UnityPy Pillow

      - name: Install FFDec SWF renderer
        run: |
          curl -fsSL \
            -o /tmp/ffdec.zip \
            https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip
          echo "0333b56998a55bd83f4e0deb678a811fcdc45607582b4f5dd438309c8c3ad5ce  /tmp/ffdec.zip" \
            | sha256sum --check
          sudo mkdir -p /opt/ffdec
          sudo unzip -q /tmp/ffdec.zip -d /opt/ffdec
          test -f /opt/ffdec/ffdec.jar

      - name: Restore previously published icon PNGs
        run: |
          mkdir -p .cache/effect-icon-png .previous
          previous_db=.previous/seerapi-data.sqlite
          if ! curl --fail --location --retry 3 \
            --output "${previous_db}" \
            https://github.com/Murmansk-Seer/seerapi/releases/download/seerapi-data-latest/seerapi-data.sqlite; then
            # One release-cycle migration fallback. The old asset is only a
            # seed; subsequent runs read seerapi-data-latest above.
            curl --fail --location --retry 3 \
              --output "${previous_db}" \
              https://github.com/Murmansk-Seer/seerapi/releases/download/ironsbot-data-latest/ironsbot-data.sqlite || true
          fi
          if [ -s "${previous_db}" ]; then
            IRONSBOT_DATA_EFFECT_ICON_PNG_CACHE_DIR=.cache/effect-icon-png \
              python scripts/build_seerapi_data_db.py \
                --seed-effect-icon-cache "${previous_db}"
          else
            echo "No previous SeerAPI data release available; rendering the full icon cache."
          fi

      - name: Render missing effect icon PNGs
        env:
          IRONSBOT_DATA_EFFECT_ICON_PNG_CACHE_DIR: .cache/effect-icon-png
          IRONSBOT_DATA_EFFECT_ICON_PNG_RENDER_FFDEC_JAR: /opt/ffdec/ffdec.jar
          # Some older animated soulmark SWFs need about 36 seconds for a
          # canonical sprite render. Keep two FFDec processes per runner so
          # their fallback render is not starved by Java process contention.
          IRONSBOT_DATA_EFFECT_ICON_PNG_RENDER_WORKERS: "2"
          IRONSBOT_DATA_EFFECT_ICON_PNG_COMPOSITE_RENDER_TIMEOUT_SECONDS: "45"
          IRONSBOT_DATA_EFFECT_ICON_PNG_SHAPE_RENDER_TIMEOUT_SECONDS: "30"
        run: |
          python scripts/build_seerapi_data_db.py \
            --render-effect-icon-shard 0 \
            --effect-icon-shard-count 1 \
            --export-effect-icon-cache-shard .artifacts/effect-icon-cache

      - name: Upload rendered icon PNG cache
        uses: actions/upload-artifact@v4
        with:
          name: effect-icon-cache
          path: .artifacts/effect-icon-cache
          retention-days: 1
          if-no-files-found: error

  build:
    needs: [plan, render-effect-icon-cache]
    if: ${{ needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install parser dependency
        run: python -m pip install UnityPy Pillow

      - name: Install FFDec SWF renderer
        run: |
          curl -fsSL \
            -o /tmp/ffdec.zip \
            https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip
          echo "0333b56998a55bd83f4e0deb678a811fcdc45607582b4f5dd438309c8c3ad5ce  /tmp/ffdec.zip" \
            | sha256sum --check
          sudo mkdir -p /opt/ffdec
          sudo unzip -q /tmp/ffdec.zip -d /opt/ffdec
          test -f /opt/ffdec/ffdec.jar

      - name: Download rendered icon PNG cache
        uses: actions/download-artifact@v4
        with:
          name: effect-icon-cache
          path: .cache/effect-icon-png

      - name: Build SeerAPI database
        env:
          IRONSBOT_DATA_EFFECT_ICON_PNG_CACHE_DIR: .cache/effect-icon-png
          IRONSBOT_DATA_EFFECT_ICON_PNG_RENDER_FFDEC_JAR: /opt/ffdec/ffdec.jar
          # Asset availability can change between the incremental render job and
          # this build. Cached PNGs are reused; only newly available misses are
          # rendered here as a bounded backstop.
          IRONSBOT_DATA_EFFECT_ICON_PNG_RENDER_WORKERS: "2"
          IRONSBOT_DATA_EFFECT_ICON_PNG_COMPOSITE_RENDER_TIMEOUT_SECONDS: "45"
          IRONSBOT_DATA_EFFECT_ICON_PNG_SHAPE_RENDER_TIMEOUT_SECONDS: "30"
        run: python scripts/build_seerapi_data_db.py

      - name: Download previous published database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_db="${RUNNER_TEMP}/previous-seerapi-data.sqlite"
          if ! curl -fL --retry 3 --retry-delay 2 \
            -o "${previous_db}" \
            https://github.com/Murmansk-Seer/seerapi/releases/download/seerapi-data-latest/seerapi-data.sqlite; then
            # Preserve the embedded new-content history while publishing the
            # first release under the corrected SeerAPI name.
            curl -fL --retry 3 --retry-delay 2 \
              -o "${previous_db}" \
              https://github.com/Murmansk-Seer/seerapi/releases/download/ironsbot-data-latest/ironsbot-data.sqlite || true
          fi
          if [ -s "${previous_db}" ]; then
            comparison_db="${previous_db}"
            read -r expected_schema previous_schema current_cycle <<< "$(
              python - "${previous_db}" <<'PY'
          import importlib.util
          from pathlib import Path
          import sqlite3
          import sys

          script = Path("scripts/build_new_content_index.py")
          spec = importlib.util.spec_from_file_location("new_content_index", script)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load new-content index module")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          with sqlite3.connect(sys.argv[1]) as connection:
              columns = module._table_columns(connection, module.RELEASE_TABLE)
              previous_schema = 1
              if "schema_version" in columns:
                  row = connection.execute(
                      f"SELECT schema_version FROM {module.RELEASE_TABLE} WHERE id = 1"
                  ).fetchone()
                  if row is not None:
                      previous_schema = int(row[0])
          with sqlite3.connect("seerapi-data.sqlite") as connection:
              current_cycle = module._weekly_cycle(module._config_version(connection))
          print(module.SEMANTIC_SCHEMA_VERSION, previous_schema, current_cycle)
          PY
            )"
            if (( previous_schema < expected_schema )); then
              history_json="${RUNNER_TEMP}/seerapi-data-history.json"
              gh release view seerapi-data-history \
                --repo "${GITHUB_REPOSITORY}" --json assets > "${history_json}"
              history_asset="$(
                python - "${history_json}" "${current_cycle}" <<'PY'
          from datetime import datetime, timedelta
          import json
          from pathlib import Path
          import re
          import sys

          def weekly_cycle(version: str) -> str:
              value = datetime.strptime(version[:8], "%Y%m%d").date()
              friday = value - timedelta(days=(value.weekday() - 4) % 7)
              return friday.isoformat()

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          current_cycle = sys.argv[2]
          candidates = []
          for asset in document["assets"]:
              match = re.fullmatch(r"seerapi-data-(\d+)\.sqlite", asset["name"])
              if match and weekly_cycle(match.group(1)) < current_cycle:
                  candidates.append((match.group(1), asset["name"]))
          if candidates:
              print(max(candidates)[1])
          PY
              )"
              if [ -n "${history_asset}" ]; then
                gh release download seerapi-data-history \
                  --repo "${GITHUB_REPOSITORY}" \
                  --pattern "${history_asset}" \
                  --dir "${RUNNER_TEMP}" --clobber
                comparison_db="${RUNNER_TEMP}/${history_asset}"
                echo "Using ${history_asset} as the semantic-schema migration baseline."
              else
                echo "No prior-cycle history asset found for semantic-schema migration."
              fi
            fi
            echo "PREVIOUS_SEERAPI_DATA_DB=${comparison_db}" >> "$GITHUB_ENV"
            echo "Downloaded previous comparison database."
          else
            echo "No previous published database is available; establishing baseline."
            rm -f "${previous_db}"
          fi

      - name: Collect API data source-history additions
        run: |
          set -euo pipefail
          history_dir="${RUNNER_TEMP}/api-data-history"
          additions_path="${RUNNER_TEMP}/api-data-history-additions.json"
          asset_updated_at="$(
            curl -fsSL https://api.github.com/repos/Murmansk-Seer/api-data/releases/tags/latest \
              | python -c 'import json, sys; print(next(asset["updated_at"] for asset in json.load(sys.stdin)["assets"] if asset["name"] == "seerapi-data.sqlite"))'
          )"
          git clone --quiet --filter=blob:none --no-checkout --depth=128 \
            https://github.com/Murmansk-Seer/api-data.git "${history_dir}"
          source_paths=(
            data/v1/data/achievement
            data/v1/data/pet
            data/v1/data/pet_skin
            data/v1/data/skill
            data/v1/data/mintmark
            data/v1/data/suit
            data/v1/data/equip
          )
          source_head="$(
            git -C "${history_dir}" log -1 --before="${asset_updated_at}" \
              --format=%H origin/main -- "${source_paths[@]}"
          )"
          if [ -z "${source_head}" ]; then
            echo "No API data entity revision was found before ${asset_updated_at}."
            exit 0
          fi
          source_base="$(git -C "${history_dir}" rev-parse "${source_head}^")"
          python scripts/build_source_history_additions.py \
            --repository "${history_dir}" \
            --base "${source_base}" \
            --head "${source_head}" \
            --output "${additions_path}"
          echo "API data history baseline: ${source_base}"
          echo "API data history revision: ${source_head}"

      - name: Build new content release index
        id: new_content
        env:
          PREVIOUS_SEERAPI_DATA_DB: ${{ env.PREVIOUS_SEERAPI_DATA_DB }}
        run: |
          set -e
          args=(--current seerapi-data.sqlite --current-git-sha "${GITHUB_SHA}")
          if [ -n "${PREVIOUS_SEERAPI_DATA_DB:-}" ] && [ -f "${PREVIOUS_SEERAPI_DATA_DB}" ]; then
            args+=(--previous "${PREVIOUS_SEERAPI_DATA_DB}")
          fi
          history_additions="${RUNNER_TEMP}/api-data-history-additions.json"
          if [ -f "${history_additions}" ]; then
            args+=(--source-history-additions "${history_additions}")
          fi
          python scripts/build_new_content_index.py "${args[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stage versioned historical data snapshot
        id: history_snapshot
        run: |
          set -euo pipefail
          config_version="$(
            python - <<'PY'
          import sqlite3

          with sqlite3.connect("seerapi-data.sqlite") as connection:
              row = connection.execute(
                  "SELECT current_config_version FROM new_content_release WHERE id = 1"
              ).fetchone()
          if row is None or not row[0]:
              raise SystemExit("new-content release has no official ConfigPackage version")
          print(row[0])
          PY
          )"
          case "${config_version}" in
            *[!0-9]* | "")
              echo "Invalid ConfigPackage version for historical snapshot: ${config_version}" >&2
              exit 1
              ;;
          esac
          mkdir -p history-release
          asset="seerapi-data-${config_version}.sqlite"
          cp seerapi-data.sqlite "history-release/${asset}"
          sha256sum "history-release/${asset}" > "history-release/${asset}.sha256"
          echo "config_version=${config_version}" >> "$GITHUB_OUTPUT"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Publish versioned historical data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_ASSET: ${{ steps.history_snapshot.outputs.asset }}
        run: |
          set -euo pipefail
          tag="seerapi-data-history"
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "SeerAPI Historical Data DBs" \
              --notes "Rolling archive of full SeerAPI runtime SQLite snapshots. The five newest official ConfigPackage versions are retained for direct comparison. `seerapi-data-latest` remains the current database used by the bot." \
              --latest=false
          fi
          gh release upload "${tag}" \
            "history-release/${HISTORY_ASSET}" \
            "history-release/${HISTORY_ASSET}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Retain five historical data snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="seerapi-data-history"
          mapfile -t versions < <(
            gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets \
              --jq '.assets[].name' \
              | sed -nE 's/^seerapi-data-([0-9]+)\.sqlite$/\1/p' \
              | sort -r
          )
          for version in "${versions[@]:5}"; do
            gh release delete-asset "${tag}" "seerapi-data-${version}.sqlite" \
              --repo "${GITHUB_REPOSITORY}" --yes
            gh release delete-asset "${tag}" "seerapi-data-${version}.sqlite.sha256" \
              --repo "${GITHUB_REPOSITORY}" --yes
          done
      - name: Report unresolved soulmark icons
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          database = Path("seerapi-data.sqlite")
          report_path = Path("effect-icon-render-report.md")
          with sqlite3.connect(database) as connection:
              soulmark_rows = connection.execute(
                  """
                  SELECT
                      icon_id,
                      pet_id,
                      pet_name,
                      soulmark_id,
                      effect_id,
                      icon_asset_status,
                      icon_asset_error,
                      icon_png_error
                  FROM soulmark_icon_render_issue
                  ORDER BY icon_id, pet_id, soulmark_id, effect_id
                  """
              ).fetchall()
              skin_rows = connection.execute(
                  """
                  SELECT
                      resolution.skin_id,
                      skin.name,
                      skin.resource_id,
                      resolution.head_resolution,
                      resolution.body_resolution,
                      resolution.source_pet_id
                  FROM skin_image_resolution AS resolution
                  JOIN pet_skin AS skin ON skin.id = resolution.skin_id
                  WHERE resolution.head_resolution IN ('unresolved', 'unverified')
                     OR resolution.body_resolution IN ('unresolved', 'unverified')
                  ORDER BY resolution.skin_id
                  """
              ).fetchall()

          def cell(value: object) -> str:
              return str(value).replace("\n", " ").replace("\r", " ").replace("|", "\\|")[:180]

          lines = ["# 资源解析报告", "", "## 魂印图标", ""]
          if not soulmark_rows:
              lines.append("本次所有已验证魂印图标均已生成可用 PNG。")
          else:
              lines.extend(
                  [
                      f"本次有 {len(soulmark_rows)} 条精灵/魂印映射未生成 PNG。",
                      "",
                      "| 图标 | 精灵 | 魂印 | 效果 | 原因 | 详情 |",
                      "| --- | --- | --- | --- | --- | --- |",
                  ]
              )
              for (
                  icon_id,
                  pet_id,
                  pet_name,
                  soulmark_id,
                  effect_id,
                  asset_status,
                  asset_error,
                  png_error,
              ) in soulmark_rows:
                  cause = "官方资源不可用" if int(asset_status) != 200 else "FFDec 未生成有效 PNG"
                  detail = (
                      asset_error
                      or (
                          f"官方返回 HTTP {asset_status}"
                          if int(asset_status) != 200
                          else png_error
                      )
                      or "未提供错误详情"
                  )
                  lines.append(
                      "| {icon_id} | {pet_name} ({pet_id}) | {soulmark_id} | {effect_id} | {cause} | {detail} |".format(
                          icon_id=cell(icon_id),
                          pet_name=cell(pet_name),
                          pet_id=cell(pet_id),
                          soulmark_id=cell(soulmark_id),
                          effect_id=cell(effect_id),
                          cause=cause,
                          detail=cell(detail),
                      )
                  )

          lines.extend(["", "## 经典皮肤图片", ""])
          if not skin_rows:
              lines.append("本次所有经典皮肤头像与立绘均已确认或完成可信来源回溯。")
          else:
              lines.extend(
                  [
                      f"本次有 {len(skin_rows)} 个经典皮肤图片资源未能确认。",
                      "",
                      "| 皮肤 | 原始资源 | 头像 | 立绘 | 回溯来源精灵 |",
                      "| --- | --- | --- | --- | --- |",
                  ]
              )
              for skin_id, name, resource_id, head_resolution, body_resolution, source_pet_id in skin_rows:
                  lines.append(
                      "| {name} ({skin_id}) | {resource_id} | {head} | {body} | {source_pet_id} |".format(
                          name=cell(name),
                          skin_id=cell(skin_id),
                          resource_id=cell(resource_id),
                          head=cell(head_resolution),
                          body=cell(body_resolution),
                          source_pet_id=cell(source_pet_id) if source_pet_id is not None else "-",
                      )
                  )

          report = "\n".join(lines) + "\n"
          report_path.write_text(report, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(report)
          PY

      - name: Generate SHA256 checksum
        run: sha256sum seerapi-data.sqlite > seerapi-data.sqlite.sha256

      - name: Record data source checksums
        run: |
          set -e
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p .build-state
          printf '%s\n' "${{ needs.plan.outputs.remote_sha }}" > .build-state/api-data-sha256
          printf '%s\n' "${{ needs.plan.outputs.remote_partner_sha }}" > .build-state/partner-contracts-sha256
          printf '%s\n' "${{ needs.plan.outputs.remote_item_catalog_sha }}" > .build-state/unity-item-catalog-sha256
          printf '%s\n' "${{ needs.plan.outputs.remote_special_effect_status_sha }}" > .build-state/special-effect-status-sha256
          printf '%s\n' "${{ needs.plan.outputs.remote_config_package_version }}" > .build-state/config-package-version
          printf '%s\n' "${{ needs.plan.outputs.remote_config_package_manifest_sha }}" > .build-state/config-package-manifest-sha256
          git add .build-state/api-data-sha256 .build-state/partner-contracts-sha256 .build-state/unity-item-catalog-sha256 .build-state/special-effect-status-sha256 .build-state/config-package-version .build-state/config-package-manifest-sha256
          if ! git diff --cached --quiet; then
            git commit -m "Record SeerAPI data source checksums"
            git push origin main
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: seerapi-data-latest
          name: SeerAPI Data DB
          make_latest: false
          body: |
            SeerAPI runtime data database.

            This database is built from the Murmansk-Seer/api-data SQLite plus
            runtime extension tables parsed from official Seer Unity
            ConfigPackage data, Murmansk-Seer/seer-unity-config-parser JSON,
            and weekly preview metadata.

            Last build commit: ${{ needs.plan.outputs.build_sha }}
            Source api-data sha256: ${{ needs.plan.outputs.remote_sha }}
            Source partner contracts sha256: ${{ needs.plan.outputs.remote_partner_sha }}
            Source Unity item catalog sha256: ${{ needs.plan.outputs.remote_item_catalog_sha }}
            Source special effect statuses sha256: ${{ needs.plan.outputs.remote_special_effect_status_sha }}
            Source ConfigPackage version: ${{ needs.plan.outputs.remote_config_package_version }}
            Source ConfigPackage manifest sha256: ${{ needs.plan.outputs.remote_config_package_manifest_sha }}
          files: |
            seerapi-data.sqlite
            seerapi-data.sqlite.sha256
            effect-icon-render-report.md
